# Reverse proxy for FlowBoard (ADR-002).
# /api/* is forwarded to the api container with the /api prefix stripped.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  server_tokens off;

  # Above the api's own 10kb limit, so Express returns the JSON 413 itself.
  client_max_body_size 16k;

  upstream api_upstream {
    server api:3000;
  }

  server {
    listen 80;

    # Errors Nginx raises itself use the API's JSON error shape (ARCH §7), not HTML pages.
    error_page 413 @payload_too_large;
    error_page 502 503 504 =503 @api_unavailable;

    location @payload_too_large {
      default_type application/json;
      return 413 '{"success":false,"message":"Request body too large","code":"PAYLOAD_TOO_LARGE"}';
    }

    location @api_unavailable {
      default_type application/json;
      return 503 '{"success":false,"message":"Service unavailable","code":"SERVICE_UNAVAILABLE"}';
    }

    location /api/ {
      # Trailing slash strips the /api prefix: /api/tasks -> /tasks.
      proxy_pass http://api_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Always Nginx-generated, so a client cannot choose its own request ID.
      proxy_set_header X-Request-Id $request_id;
    }

    location / {
      default_type application/json;
      return 404 '{"success":false,"message":"Not found","code":"ROUTE_NOT_FOUND"}';
    }
  }
}
