# FlowBoard dev stack: 5 services on one network (ARCH §11.1).
# Nginx on :80 is the only entry point; the api port is not published (ADR-002).
name: flowboard

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: dev
    init: true
    env_file: .env
    # Prisma Studio only (ADR-002), bound to loopback. Start it with `npm run db:studio`.
    ports:
      - '127.0.0.1:5555:5555'
    volumes:
      - ./api:/app
      # Keeps the image's node_modules from being hidden by the bind mount.
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      # Repo root, so the worker can read api/prisma/schema.prisma from day-08 (ADR-001).
      context: .
      dockerfile: worker/Dockerfile
      target: dev
    init: true
    env_file: .env
    volumes:
      - ./worker:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
